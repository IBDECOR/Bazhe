<style>*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}:root{padding:env(safe-area-inset-top,0px) 0 0}html{background:#05060d;min-height:100%}body{-webkit-touch-callout:none}img{-webkit-touch-callout:none;-webkit-user-drag:none;user-select:none;-webkit-user-select:none}.me img,.ava img,.bigava img,.tile,.petal{pointer-events:none}.petal{pointer-events:auto}.me,.ava,.bigava,.bub{-webkit-touch-callout:none;-webkit-user-select:none;user-select:none}body{margin:0}[hidden]{display:none!important}img{max-width:100%}</style>
<title>Bazhe</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;600;700;800&display=swap">
<style>
/* Layout: one-screen app — aurora background, liquid-glass layers, orbit "Фловер" launcher */
:root{
  --bg:#05060d; --fg:#f4f6fb; --mute:rgba(235,240,255,.62);
  --glass:rgba(255,255,255,.08); --glass2:rgba(255,255,255,.14); --edge:rgba(255,255,255,.22);
  --accent:#ff8a3d; --accent2:#5ee7ff; --mine:rgba(94,140,255,.32);
  --font:"Onest",system-ui,-apple-system,sans-serif;
  color-scheme:dark;
}
html,body{height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--font);overflow:hidden;letter-spacing:-.01em;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
/* aurora */
.aurora{position:fixed;top:-20vh;left:-20vw;width:140vw;height:calc(100lvh + 40vh);z-index:0;filter:blur(70px) saturate(140%);pointer-events:none}
.aurora i{position:absolute;border-radius:50%;opacity:.75;mix-blend-mode:screen}
.aurora i:nth-child(1){width:55vmax;height:55vmax;left:5%;top:10%;background:#2b4dff;animation:a1 22s ease-in-out infinite alternate}
.aurora i:nth-child(2){width:45vmax;height:45vmax;right:0;top:30%;background:#ff5a3d;animation:a2 26s ease-in-out infinite alternate}
.aurora i:nth-child(3){width:40vmax;height:40vmax;left:25%;bottom:0;background:#00c2a8;animation:a3 19s ease-in-out infinite alternate}
.aurora i:nth-child(4){width:30vmax;height:30vmax;left:50%;top:0;background:#a93dff;animation:a1 30s ease-in-out infinite alternate-reverse}
@keyframes a1{to{transform:translate(18vmax,14vmax) scale(1.2)}}
@keyframes a2{to{transform:translate(-20vmax,-10vmax) scale(.85)}}
@keyframes a3{to{transform:translate(10vmax,-18vmax) scale(1.15)}}
.grain{position:fixed;top:0;left:0;width:100vw;height:100lvh;z-index:0;pointer-events:none;background:radial-gradient(ellipse at center,transparent 40%,rgba(0,0,0,.55))}
/* liquid glass */
.lg{background:linear-gradient(135deg,rgba(255,255,255,.16),rgba(255,255,255,.04));backdrop-filter:blur(22px) saturate(180%);-webkit-backdrop-filter:blur(22px) saturate(180%);
  border:1px solid var(--edge);box-shadow:inset 0 1px 0 rgba(255,255,255,.35),inset 0 -1px 0 rgba(255,255,255,.06),0 10px 30px rgba(0,0,0,.35)}
.app{position:relative;z-index:1;height:100%;max-width:520px;margin:0 auto}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
button:focus-visible,input:focus-visible{outline:2px solid var(--accent2);outline-offset:2px}

/* ===== Фловер ===== */
.home{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:22px;transition:transform .55s cubic-bezier(.6,0,.2,1),opacity .4s,filter .4s}
.home.away{transform:scale(.7);opacity:0;filter:blur(12px);pointer-events:none}
.brand{font-weight:800;font-size:28px;letter-spacing:-.03em}
.brand span{font-weight:500;color:var(--mute)}
.flower{position:relative;width:min(90vw,380px);aspect-ratio:1;max-width:100%}
.ring{position:absolute;inset:0;border-radius:50%;border:1px solid rgba(255,255,255,.10);box-shadow:inset 0 0 40px rgba(255,255,255,.04)}
.ring.r2{inset:19%}
.me{position:absolute;inset:35%;border-radius:50%;display:grid;place-items:center;font-size:30px;font-weight:800;overflow:hidden;
  background:radial-gradient(circle at 30% 25%,#ffd0a8,#ff8a3d 45%,#c2410c);box-shadow:0 0 0 7px rgba(255,255,255,.08),0 0 70px rgba(255,138,61,.55),inset 0 2px 6px rgba(255,255,255,.6);animation:breathe 3s ease-in-out infinite}
.me img{width:100%;height:100%;object-fit:cover}
@keyframes breathe{50%{box-shadow:0 0 0 13px rgba(255,255,255,.04),0 0 100px rgba(255,138,61,.7),inset 0 2px 6px rgba(255,255,255,.6)}}
.petal{position:absolute;left:50%;top:50%;width:72px;height:84px;margin:-42px -36px;display:flex;flex-direction:column;align-items:center;gap:5px;font-size:11px;font-weight:600;color:var(--fg);text-shadow:0 1px 6px rgba(0,0,0,.6)}
.tile{width:60px;height:60px;border-radius:20px;display:grid;place-items:center;position:relative;overflow:hidden;transition:transform .25s cubic-bezier(.3,1.6,.5,1)}
.tile::after{content:"";position:absolute;inset:0;border-radius:inherit;background:linear-gradient(160deg,rgba(255,255,255,.55),rgba(255,255,255,0) 45%);mix-blend-mode:overlay}
.tile svg{width:32px;height:32px;position:relative;z-index:1;filter:drop-shadow(0 2px 4px rgba(0,0,0,.35))}
.petal:hover .tile{transform:scale(1.12)}
.petal:active .tile{transform:scale(.92)}
.petal.soon .lbl::after{content:" ·скоро";color:var(--mute);font-weight:500}
.dot{position:absolute;left:50%;top:50%;width:8px;height:8px;margin:-4px;border-radius:50%;background:#fff;box-shadow:0 0 12px var(--accent2)}
.hint{min-height:2.9em;display:flex;align-items:flex-start;justify-content:center;color:var(--mute);font-size:14px;text-align:center;max-width:30ch}

/* intro */
.intro{position:absolute;inset:0;display:grid;place-items:center;z-index:5;transition:opacity .7s,filter .7s}
.intro.done{opacity:0;filter:blur(20px);pointer-events:none}
.intro canvas{width:200px;height:200px}

/* ===== panels ===== */
.panel{position:absolute;inset:0;display:flex;flex-direction:column;gap:10px;padding-block:10px;transform:translateX(108%);opacity:0;transition:transform .5s cubic-bezier(.6,0,.2,1),opacity .4s}
.panel.open{transform:none;opacity:1}
.bar{display:flex;align-items:center;gap:12px;padding:8px;border-radius:26px}
.bar h2{font-size:19px;font-weight:700;margin:0;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;letter-spacing:-.02em}
.back{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;flex:none}
.back svg{width:18px;stroke:var(--fg);fill:none;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round}
.list{flex:1;overflow-y:auto;display:flex;flex-direction:column;gap:8px}
.room{display:flex;gap:12px;align-items:center;padding:10px;border-radius:22px;text-align:left;width:100%;transition:transform .2s}
.room:hover{transform:scale(1.015)}
.ava{width:48px;height:48px;flex:none;border-radius:16px;display:grid;place-items:center;font-size:22px;overflow:hidden;background:linear-gradient(135deg,rgba(255,255,255,.25),rgba(255,255,255,.05));border:1px solid var(--edge)}
.ava img{width:100%;height:100%;object-fit:cover}
.room b{display:block;font-weight:600;font-size:16px}.room small{color:var(--mute);display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:13px}
.room>div{min-width:0;flex:1}
.newroom,.compose{display:flex;gap:8px;align-items:center;padding:6px;border-radius:30px}
.compose{margin-bottom:env(safe-area-inset-bottom,0px)}
input[type=text],input[type=email],input[type=password]{-webkit-appearance:none;appearance:none;border-radius:14px;flex:1;min-width:0;background:transparent;border:0;color:var(--fg);padding:10px 12px;font:inherit;font-size:16px}
input::placeholder{color:var(--mute)}
input[type=text]:focus-visible,input[type=email]:focus-visible,input[type=password]:focus-visible{outline:none}
.field{transition:border-color .25s,box-shadow .25s}.field:focus-within{border-color:rgba(255,170,110,.7);box-shadow:inset 0 1px 0 rgba(255,255,255,.35),0 0 0 4px rgba(255,138,61,.18),0 10px 30px rgba(0,0,0,.35)}
input:-webkit-autofill{-webkit-text-fill-color:#f4f6fb;-webkit-box-shadow:0 0 0 100px transparent inset;transition:background-color 9999s}
.send{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;flex:none;background:linear-gradient(135deg,#ffb36b,#ff6a2b);box-shadow:inset 0 1px 0 rgba(255,255,255,.6),0 6px 18px rgba(255,106,43,.45)}
.send svg{width:20px;fill:#fff}
.msgs{flex:1;overflow-y:auto;display:flex;flex-direction:column;gap:8px;padding-block:6px}
.msg{align-self:flex-start;width:fit-content;max-width:80%;background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.12);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);padding:7px 12px 6px;border-radius:22px 22px 22px 8px;line-height:1.4;animation:pop .35s cubic-bezier(.3,1.5,.5,1);overflow-wrap:anywhere}
.msg.mine{align-self:flex-end;border-radius:22px 22px 8px 22px;background:linear-gradient(135deg,rgba(110,150,255,.45),rgba(90,70,255,.25))}
.msg .who{font-size:12px;font-weight:700;color:var(--accent2);margin-bottom:2px}
.msg .tx{display:inline}.msg time{float:right;font-size:10px;color:var(--mute);margin:7px 0 -3px 10px;line-height:1;font-variant-numeric:tabular-nums}
@keyframes pop{from{transform:scale(.6) translateY(12px);opacity:0}}
.emo{width:44px;height:44px;border-radius:50%;font-size:20px;flex:none}
.empty{color:var(--mute);text-align:center;margin:auto;max-width:28ch;font-size:15px}
.soonbox{margin:auto;padding:28px;border-radius:30px;text-align:center;display:flex;flex-direction:column;align-items:center;gap:14px;max-width:320px}
.soonbox .tile{width:84px;height:84px;border-radius:28px}.soonbox .tile svg{width:44px;height:44px}
.toast{position:absolute;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translate(-50%,40px);opacity:0;padding:10px 18px;border-radius:22px;font-size:14px;transition:.3s;white-space:nowrap}
.toast.show{transform:translate(-50%,0);opacity:1}
.petal,.dot,.aurora i,.me{will-change:transform}
.portal{position:fixed;inset:0;z-index:4;pointer-events:none;clip-path:circle(0 at 50% 50%)}
.portal .tile{position:absolute;width:60px;height:60px;margin:-30px;border-radius:20px}
.petal.bulk .tile{animation:bulk .42s cubic-bezier(.3,1.6,.5,1)}
@keyframes bulk{0%{transform:scale(1)}35%{transform:scale(.78,.72)}100%{transform:scale(1.25)}}
.me{cursor:pointer;touch-action:none;-webkit-user-select:none;user-select:none;transition:transform .5s cubic-bezier(.3,1.6,.5,1)}
.me.press{transform:scale(.82);transition:transform .6s cubic-bezier(.2,.8,.2,1)}
.me.pop{animation:mepop .45s cubic-bezier(.3,1.6,.5,1)}
@keyframes mepop{0%{transform:scale(.8)}50%{transform:scale(1.12,1.06)}100%{transform:scale(1)}}
.hold{position:absolute;left:calc(35% - 10px);top:calc(35% - 10px);width:calc(30% + 20px);height:calc(30% + 20px);overflow:visible;pointer-events:none;transform:rotate(-90deg)}
.hold circle{fill:none;stroke:#fff;stroke-width:3;stroke-linecap:round;stroke-dasharray:314;stroke-dashoffset:314;filter:drop-shadow(0 0 6px #fff)}
.prof{flex:1;overflow-y:auto;display:flex;flex-direction:column;align-items:center;gap:18px;padding-block:16px}
.bigava{width:140px;height:140px;border-radius:50%;display:grid;place-items:center;font-size:54px;font-weight:800;overflow:hidden;position:relative;
  background:radial-gradient(circle at 30% 25%,#ffd0a8,#ff8a3d 45%,#c2410c);box-shadow:0 0 0 8px rgba(255,255,255,.08),0 0 80px rgba(255,138,61,.5)}
.bigava img{width:100%;height:100%;object-fit:cover}
.camera{position:absolute;right:calc(50% - 74px);margin-top:104px;width:42px;height:42px;border-radius:50%;display:grid;place-items:center}
.camera svg{width:20px;fill:#fff}
.field{width:100%;max-width:400px;border-radius:22px;padding:6px 8px;display:flex;flex-direction:column}
.field label{font-size:12px;color:var(--mute);padding:6px 12px 0}
.save{width:100%;max-width:400px;height:52px;border-radius:26px;font-weight:700;font-size:16px;background:linear-gradient(135deg,#ffb36b,#ff6a2b);box-shadow:inset 0 1px 0 rgba(255,255,255,.6),0 10px 26px rgba(255,106,43,.45)}
.ph{position:relative}
.zig{position:absolute;inset:26%;width:48%;height:48%;pointer-events:none;filter:drop-shadow(0 0 4px #5ee7ff) drop-shadow(0 0 10px rgba(255,138,61,.6));transition:opacity .4s}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(88px,1fr));gap:18px 10px;padding-block:14px;align-content:start}
.bub{display:flex;flex-direction:column;align-items:center;gap:7px;-webkit-user-select:none;user-select:none;touch-action:manipulation;-webkit-touch-callout:none}
.bub .ava{width:74px;height:74px;border-radius:50%;font-size:30px;transition:transform .35s cubic-bezier(.3,1.6,.5,1);box-shadow:inset 0 1px 1px rgba(255,255,255,.5),0 10px 24px rgba(0,0,0,.35)}
.bub.press .ava{transform:scale(.86);transition-duration:.5s}
.bub b{font-size:13px;font-weight:600;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bub small{font-size:11px;color:var(--mute);max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;margin-top:-5px}
.sect{font-size:12px;font-weight:600;color:var(--mute);text-transform:uppercase;letter-spacing:.08em;padding:6px 4px 0;display:flex;align-items:center;gap:6px}
.sheetwrap{position:fixed;inset:0;z-index:6;display:flex;align-items:flex-end;justify-content:center;background:rgba(0,0,0,.35);padding:0 max(12px,env(safe-area-inset-left,0px)) calc(12px + env(safe-area-inset-bottom,0px))}
.sheet{width:100%;max-width:440px;border-radius:30px;padding:18px;display:flex;flex-direction:column;gap:10px;align-items:stretch}
.sheet .head{display:flex;flex-direction:column;align-items:center;gap:8px;padding-bottom:4px}
.sheet .head .ava{width:84px;height:84px;border-radius:50%;font-size:34px;cursor:pointer;position:relative}
.act{height:50px;border-radius:18px;font-weight:600;font-size:16px;background:rgba(255,255,255,.08);border:1px solid var(--edge)}
.act.red{color:#ff5a6a}.act.main{background:linear-gradient(135deg,#ffb36b,#ff6a2b);border:0}
.emos{display:flex;gap:6px;justify-content:center;flex-wrap:wrap}
.emos button{width:40px;height:40px;border-radius:50%;font-size:20px;background:rgba(255,255,255,.06)}
.emos button[aria-pressed=true]{background:rgba(255,255,255,.25)}
.fab{position:absolute;right:6px;bottom:calc(14px + env(safe-area-inset-bottom,0px));width:64px;height:64px;border-radius:50%;z-index:3;
  background:linear-gradient(145deg,#ffb36b,#ff6a2b);box-shadow:inset 0 1px 1px rgba(255,255,255,.7),0 12px 30px rgba(255,106,43,.55);transition:transform .45s cubic-bezier(.3,1.6,.5,1),right .5s cubic-bezier(.6,0,.2,1),bottom .5s cubic-bezier(.6,0,.2,1),width .5s,height .5s}
.fab::before{content:"";position:absolute;inset:-8px;border-radius:50%;border:2px solid rgba(255,160,90,.6);animation:ping 2.2s cubic-bezier(.2,.6,.4,1) infinite}
@keyframes ping{0%{transform:scale(.85);opacity:.9}100%{transform:scale(1.45);opacity:0}}
.fab span,.fab span::after{position:absolute;left:50%;top:50%;width:26px;height:3.5px;margin:-1.75px -13px;border-radius:2px;background:#fff;content:""}
.fab span::after{transform:rotate(90deg);margin:0;left:0;top:0}
.fab span{transition:transform .45s cubic-bezier(.3,1.6,.5,1)}
.fab.on span{transform:rotate(135deg)}
.fab.center{right:calc(50% - 50px);bottom:calc(50% - 50px);width:100px;height:100px}
.fab.center span,.fab.center span::after{width:38px;height:4px;margin:-2px -19px}
.fab.center span::after{margin:0}
.fabmenu{position:absolute;inset:0;z-index:2;background:rgba(5,6,13,.35);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px)}
.fopt{position:absolute;display:flex;align-items:center;gap:10px;padding:12px 18px 12px 12px;border-radius:30px;font-weight:600;font-size:15px;white-space:nowrap}
.fopt i{font-style:normal;width:38px;height:38px;border-radius:50%;display:grid;place-items:center;background:rgba(255,255,255,.14);font-size:18px}
.idrow{width:100%;max-width:400px;border-radius:22px;padding:12px 14px;display:flex;align-items:center;gap:12px}
.idrow div{flex:1;min-width:0}.idrow small{display:block;color:var(--mute);font-size:12px}
.idrow b{font-size:22px;letter-spacing:.14em;font-variant-numeric:tabular-nums}
.copy{height:38px;padding:0 14px;border-radius:19px;background:rgba(255,255,255,.12);font-weight:600}
.bub{position:relative}.ubadge{position:absolute;top:-2px;left:calc(50% + 18px);min-width:24px;height:24px;padding:0 7px;border-radius:12px;display:grid;place-items:center;font-size:12px;font-weight:700;color:#fff;background:linear-gradient(135deg,#ff6a5b,#ff2d55);box-shadow:0 0 0 3px rgba(5,6,13,.6),0 4px 12px rgba(255,45,85,.6);animation:pop .4s cubic-bezier(.3,1.6,.5,1)}
.petal .badge{position:absolute;top:-4px;left:calc(50% + 14px);min-width:22px;height:22px;padding:0 6px;border-radius:11px;display:grid;place-items:center;font-size:11px;font-weight:700;color:#fff;background:linear-gradient(135deg,#ff6a5b,#ff2d55);box-shadow:0 0 0 3px rgba(5,6,13,.5),0 4px 12px rgba(255,45,85,.6);z-index:2;text-shadow:none}
.msg.cont{margin-top:-6px}.msg.cont:not(.mine){border-top-left-radius:8px}.msg.mine.cont{border-top-right-radius:8px}
.msg.big{background:none;border:0;backdrop-filter:none;-webkit-backdrop-filter:none;padding:0 4px}.msg.big .tx{font-size:40px;line-height:1.1;display:block}.msg.big time{float:none;display:block;text-align:right;margin:2px 0 0}
.haze{position:fixed;top:0;left:0;width:100vw;height:100lvh;z-index:0;pointer-events:none;background:rgba(10,12,20,.62);backdrop-filter:blur(10px) saturate(.6);-webkit-backdrop-filter:blur(10px) saturate(.6);opacity:0;transition:opacity .5s}.haze.on{opacity:1}
.boom{position:absolute;left:-30%;top:-30%;width:160%;height:160%;pointer-events:none;z-index:0}
.prof{gap:10px;padding-block:10px}.prof>*{flex-shrink:0}
#pProf .field{padding:4px 6px;border-radius:18px}#pProf .field label{padding:4px 10px 0;font-size:11px}#pProf .field input{padding:4px 10px 8px}
#pProf .idrow{padding:9px 12px;border-radius:18px}#pProf .idrow b{font-size:18px;letter-spacing:.12em;white-space:nowrap}#pProf .idrow small{font-size:11px}
#pProf .copy{height:32px;padding:0 12px;font-size:13px;flex:none}
#pProf .bigava{width:116px;height:116px;font-size:44px}#pProf .camera{margin-top:84px;right:calc(50% - 62px);width:36px;height:36px}
#pProf .save{height:48px;flex-shrink:0}#pProf .act{height:46px}
.tick{display:inline-block;vertical-align:-1px;margin-left:4px;width:16px;height:10px}.tick svg{width:100%;height:100%;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.tick.p{width:11px;height:11px;color:var(--mute)}.tick.s{width:12px;color:rgba(235,240,255,.75)}.tick.r{width:17px;color:#5ee7ff;filter:drop-shadow(0 0 3px rgba(94,231,255,.6))}
.ttl{flex:1;min-width:0;display:flex;flex-direction:column}.ttl h2{flex:none}
.sub{font-size:12px;color:var(--mute);min-height:15px;display:flex;align-items:center;gap:4px;white-space:nowrap;overflow:hidden}.sub.online{color:#5ee7ff}.sub.typing{color:#7dffb0}
.dots{display:inline-flex;gap:3px}.dots i{width:4px;height:4px;border-radius:50%;background:currentColor;animation:dt 1.2s infinite}.dots i:nth-child(2){animation-delay:.15s}.dots i:nth-child(3){animation-delay:.3s}
@keyframes dt{0%,60%,100%{transform:none;opacity:.4}30%{transform:translateY(-3px);opacity:1}}
.msg.old{animation:none}.msg{touch-action:pan-y;position:relative;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
.msg.arm::before{content:"↩";position:absolute;left:-30px;top:50%;transform:translateY(-50%);font-size:18px;color:#fff;opacity:.9}

 fam:'<path d="M12 2.8l9.5 8.2h-2.5v9a1 1 0 01-1 1h-12a1 1 0 01-1-1v-9H2.5z" fill="#fff"/><path d="M12 18.5s-4-2.5-4-5.2A2.2 2.2 0 0112 12a2.2 2.2 0 014 1.3c0 2.7-4 5.2-4 5.2z" fill="#b14dff"/>',
 list:'<path d="M5 7h15l-1.8 9.2a2 2 0 01-2 1.8H8.8a2 2 0 01-2-1.6z" fill="#fff"/><path d="M2 3.5h3l1 3.5" stroke="#fff" stroke-width="2" fill="none" stroke-linecap="round"/><circle cx="9" cy="20.5" r="1.6" fill="#fff"/><circle cx="16" cy="20.5" r="1.6" fill="#fff"/><path d="M9.5 12l2 2 4-4" stroke="#00b894" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/>'

const PETALS=[

(function(){const N=720,pts=[];for(let i=0;i<=N;i++){const a=i/N*Math.PI*2-Math.PI/2,r=46.5+2.6*Math.sin(a*16);pts.push((50+Math.cos(a)*r).toFixed(2)+' '+(50+Math.sin(a)*r).toFixed(2))}

 $('intro').hidden=true;const me=$('me');me.style.opacity=0;$('hint').style.opacity=0;
 const e='cubic-bezier(.65,0,.25,1)';
 me.animate([{opacity:0,transform:'scale(.6)'},{opacity:1,transform:'scale(1)'}],{duration:700,easing:'cubic-bezier(.3,1.5,.5,1)',fill:'forwards'}).onfinish=()=>{me.style.opacity=1;me.getAnimations().forEach(a=>a.cancel())};
 const zs=$('zig');zs.animate([{transform:'rotate(-120deg)'},{transform:'rotate(240deg)'}],{duration:1700,easing:e,fill:'forwards'});
 z.animate([{strokeDashoffset:L},{strokeDashoffset:0,offset:.55},{strokeDashoffset:-L}],{duration:1700,easing:e,fill:'forwards'}).onfinish=()=>{zs.style.opacity=0;$('hint').animate([{opacity:0},{opacity:1}],{duration:500,fill:'forwards'})};
})();

/* ---- Фловер: petals on two orbits ---- */
const flower=$('flower'),petEls=[],dots=[];
PETALS.forEach((p,i)=>{const b=document.createElement('button');b.className='petal'+(p.soon?' soon':'');
 b.innerHTML=tileHTML(p.i)+'<span class="lbl">'+p.t+'</span>';b.setAttribute('aria-label',p.t);b.onclick=()=>portal(p,b);flower.appendChild(b);petEls.push(b);});
for(let i=0;i<5;i++){const d=document.createElement('i');d.className='dot';flower.appendChild(d);dots.push(d)}
let start=performance.now(),bloomOpen=false,bloomT0=-1e5;
const backOut=k=>{const c=1.7;return 1+(c+1)*Math.pow(k-1,3)+c*Math.pow(k-1,2)};
const boom=(()=>{const c=$('boom'),x=c.getContext('2d');let P=[],raf=0,dpr=Math.min(devicePixelRatio||1,3);
 const COLS=['#5ea2ff','#ff2d55','#16b862','#ffb020','#b14dff','#00a389','#ffffff','#ff8a3d'];
 function size(){const r=c.getBoundingClientRect();c.width=r.width*dpr;c.height=r.height*dpr}
 function frame(){x.clearRect(0,0,c.width,c.height);const now=performance.now();P=P.filter(p=>now-p.t0<p.life);
  for(const p of P){const k=(now-p.t0)/p.life;let px,py;
   if(p.inward){const e=1-Math.pow(1-k,3);px=p.x0+(p.cx-p.x0)*e;py=p.y0+(p.cy-p.y0)*e}else{const e=1-Math.pow(1-k,3);px=p.cx+p.vx*e;py=p.cy+p.vy*e+p.g*k*k}
   const a=p.inward?Math.min(1,k*3)*(1-k*.4):1-k;x.globalAlpha=a;x.fillStyle=p.col;x.shadowColor=p.col;x.shadowBlur=12*dpr;
   x.beginPath();x.arc(px,py,p.r*(p.inward?1-k*.6:1-k*.5),0,7);x.fill()}
  x.globalAlpha=1;if(P.length)raf=requestAnimationFrame(frame);else{raf=0;x.clearRect(0,0,c.width,c.height)}}
 return function(inward){size();const cx=c.width/2,cy=c.height/2,now=performance.now(),R0=c.width*.38;
  for(let i=0;i<70;i++){const a=Math.random()*Math.PI*2,d=R0*(.35+Math.random()*.75),col=COLS[i%COLS.length],r=(1.5+Math.random()*3.5)*dpr;
   P.push(inward?{inward:1,cx,cy,x0:cx+Math.cos(a)*d,y0:cy+Math.sin(a)*d,r,col,t0:now+Math.random()*120,life:520+Math.random()*260}
    :{cx,cy,vx:Math.cos(a)*d,vy:Math.sin(a)*d,g:30*dpr,r,col,t0:now+Math.random()*60,life:700+Math.random()*500})}
  if(!raf)raf=requestAnimationFrame(frame)}})();
function toggleBloom(){bloomOpen=!bloomOpen;bloomT0=performance.now();try{boom(!bloomOpen)}catch(_){};$('hint').textContent=bloomOpen?'Выбери раздел. Удерживай аватарку, чтобы изменить профиль':'Коснись аватарки, чтобы раскрыть меню'}

 requestAnimationFrame(spin);}
requestAnimationFrame(spin);

/* long press */
(function(){const me=$('me'),arc=$('holdArc');let t0=0,raf=0,fired=false;

function calibrate(){const p=fam[myId];if(p&&p.lastSeen&&myLastWrite){const off=ms(p.lastSeen)-myLastWrite;if(Math.abs(off)<6*3600e3)clockOff=off}}

function openRoom(r){curRoom=r;shownIds=new Set();replyTo=null;editing=null;paintBar();markRead(r);paintBadges();$('roomTitle').textContent=disp(r).name;avaFill($('roomAva'),r);$('roomSub').dataset.t='';paintSub();show('pRoom');heartbeat();
 if(db){unsubMsgs=db.collection('rooms/'+r.id+'/msgs').orderBy('at','asc').limitToLast(300).onSnapshot(s=>{const list=s.docs.map(d=>({id:d.id,...d.data({serverTimestamps:'estimate'}),_p:d.metadata.hasPendingWrites}));
   list.forEach(m=>{if(m.from!==myId)stopTyping(r.id,m.from)});renderMsgs(list)},e=>toast('Не удалось загрузить сообщения'));}
 else renderMsgs(local.msgs[r.id]||[]);}
function closeRoom(){if(unsubMsgs){unsubMsgs();unsubMsgs=null}curRoom=null;replyTo=null;editing=null;renderRooms();paintBadges()}

async function send(text){text=text.trim();if(!text||!curRoom)return;
 if(editing){const e=editing;editing=null;paintBar();if(text!==e.text&&db){try{await db.doc('rooms/'+curRoom.id+'/msgs/'+e.id).update({text,edited:true})}catch(_){toast('Не удалось изменить')}}return}
 const TS=firebase.firestore.FieldValue.serverTimestamp(),INC=firebase.firestore.FieldValue.increment(1);const m={from:myId,text,at:db?TS:Date.now()};
 if(replyTo){m.reply=replyTo;replyTo=null;paintBar()}
 if(db){try{await db.collection('rooms/'+curRoom.id+'/msgs').add(m);await db.doc('rooms/'+curRoom.id).update({last:text.slice(0,60),at:TS,count:INC,['read.'+myId]:INC})}catch(e){toast('Не отправилось. Проверь доступ к чату')}}
 else{(local.msgs[curRoom.id]=local.msgs[curRoom.id]||[]).push(m);curRoom.last=text;renderMsgs(local.msgs[curRoom.id]);renderRooms()}}
$('compose').onsubmit=e=>{e.preventDefault();const v=$('text').value;$('text').value='';send(v)};
$('heart').onclick=()=>send('❤️');
$('text').addEventListener('input',()=>{if($('text').value)sendTyping()});
$('replyX').onclick=()=>{if(editing)$('text').value='';replyTo=null;editing=null;paintBar()};
$('msgs').addEventListener('scroll',()=>{if(nearBottom())newBelow=0;paintDown()},{passive:true});
$('downBtn').onclick=()=>toBottom(true);

const EMO=['🏠','🌲','🚗','🎉','🛒','🔥','⚙️','🐾'];
/* plus menu */
function fabToggle(open){const fab=$('fab'),m=$('fabMenu');const on=open??!fab.classList.contains('on');fab.classList.toggle('on',on);
 if(on){m.hidden=false;const pr=$('pChats').getBoundingClientRect(),fr=fab.getBoundingClientRect(),cx=fr.left+fr.width/2-pr.left,cy=fr.top+fr.height/2-pr.top,center=fab.classList.contains('center');
  [$('optGroup'),$('optContact')].forEach((o,i)=>{const ang=center?(i?Math.PI*.25:-Math.PI*1.25)-Math.PI/2+(i?0:0):(-Math.PI/2-(i?0:.0)),dist=center?110:0;
   let tx,ty;if(center){const a=i?Math.PI/4:Math.PI*3/4;tx=cx+Math.cos(a+Math.PI)*0;ty=cy+(i?95:-95);tx=cx}else{tx=pr.width-14;ty=cy-(i?150:84)}
   o.style.left=tx+'px';o.style.top=ty+'px';o.style.transform=center?'translate(-50%,-50%)':'translate(-100%,-50%)';
   o.animate([{transform:`translate(${cx-tx}px,${cy-ty}px) translate(-50%,-50%) scale(.2)`,opacity:0},{transform:o.style.transform,opacity:1}],{duration:520,delay:i*70,easing:'cubic-bezier(.2,1.4,.4,1)',fill:'backwards'})});
  m.animate([{opacity:0},{opacity:1}],{duration:250})}
 else m.animate([{opacity:1},{opacity:0}],{duration:200}).onfinish=()=>{m.hidden=true}}
$('fab').onclick=()=>fabToggle();
$('fabMenu').addEventListener('click',e=>{if(e.target===$('fabMenu'))fabToggle(false)});
function field(sh,label,ph,max){const f=document.createElement('div');f.className='field lg';const l=document.createElement('label');l.textContent=label;const i=document.createElement('input');i.type='text';i.placeholder=ph;i.maxLength=max;i.id='f'+Math.random().toString(36).slice(2,7);l.htmlFor=i.id;f.append(l,i);sh.appendChild(f);return i}
async function findByCode(c){c=c.trim();if(c.includes('@')){if(!db)return null;if(c.toLowerCase()===auth.currentUser?.email?.toLowerCase())return'self';try{const d=await db.doc('lookup/'+c.toLowerCase()).get();if(!d.exists)return null;const id=d.data().uid;const p=await db.doc('profiles/'+id).get();return p.exists&&p.data().findable===false?null:id}catch(_){return null}}
 c=c.trim().toUpperCase().replace(/[^A-Z0-9]/g,'');if(c.length!==6)return null;if(c===myCode)return'self';
 const id=Object.keys(fam).find(k=>fam[k].code===c);if(id)return id;if(!db)return null;try{const s=await db.collection('profiles').where('code','==',c).limit(1).get();return s.empty?null:s.docs[0].id}catch(_){return null}}
$('optContact').onclick=()=>{fabToggle(false);sheet((sh,close)=>{const h=document.createElement('div');h.className='head';h.innerHTML='<div class="ava">👤</div><b>Добавить контакт</b>';sh.appendChild(h);
 const inp=field(sh,'ID или почта друга','K7M2QX или friend@mail.ru',80);
 const n=document.createElement('p');n.className='sect';n.style.cssText='text-transform:none;letter-spacing:0;justify-content:center;text-align:center';n.textContent='Свой ID друг найдёт в профиле: удержи аватарку на главном экране.';sh.appendChild(n);
 sh.appendChild(btn('Начать переписку','main',async()=>{if(!db){toast('Нужен вход в аккаунт');return}const id=await findByCode(inp.value);
  if(id==='self'){toast('Это твой собственный ID');return}if(!id){toast('Не нашёл. Проверь ID или почту');inp.parentNode.animate([{transform:'translateX(-8px)'},{transform:'translateX(8px)'},{transform:'none'}],{duration:260});return}
  const rid='dm_'+[myId,id].sort().join('_');const ex=rooms.find(r=>r.id===rid);
  if(!ex){try{await db.doc('rooms/'+rid).set({type:'dm',members:[myId,id],name:'',last:'',at:Date.now()})}catch(_){toast('Не удалось создать чат');return}}
  close();setTimeout(()=>openRoom(ex||{id:rid,type:'dm',members:[myId,id],name:'',last:''}),300)}));
 sh.appendChild(btn('Отмена','',close));setTimeout(()=>inp.focus(),400)})};
$('optGroup').onclick=()=>{fabToggle(false);sheet((sh,close)=>{const h=document.createElement('div');h.className='head';h.innerHTML='<div class="ava">👥</div><b>Новая группа</b>';sh.appendChild(h);
 const nameI=field(sh,'Название','Например: Семья, Дача',40);const ids=field(sh,'ID участников через запятую','K7M2QX, P4TR9A',80);
 sh.appendChild(btn('Создать группу','main',async()=>{const n=nameI.value.trim();if(!n){toast('Впиши название');return}
  const mem=[myId];for(const c of ids.value.split(/[ ,;]+/).filter(Boolean)){const id=await findByCode(c);if(id&&id!=='self'&&!mem.includes(id))mem.push(id);else if(id!=='self'){toast('ID '+c.toUpperCase()+' не найден');return}}
  const r={type:'group',name:n,emoji:EMO[Math.floor(Math.random()*EMO.length)],members:mem,last:'',at:Date.now()};
  if(db){try{await db.collection('rooms').add(r);toast('Группа «'+n+'» создана')}catch(_){toast('Не удалось создать группу');return}}else{r.id='r'+Date.now();local.rooms.push(r);rooms=local.rooms;renderRooms()}close()}));
 sh.appendChild(btn('Отмена','',close));setTimeout(()=>nameI.focus(),400)})};
$('logout').onclick=async()=>{await auth.signOut();show(null);toast('Ты вышел')};
$('copyId').onclick=async()=>{try{await navigator.clipboard.writeText(myCode);toast('ID скопирован')}catch(_){const r=document.createRange();r.selectNodeContents($('myCode'));const se=getSelection();se.removeAllRanges();se.addRange(r);toast('Выделил ID, скопируй вручную')}};

rooms=local.rooms;renderRooms();paintMe();

const auth=firebase.auth(),fdb=firebase.firestore();let authed=false,unsubs=[];
auth.onAuthStateChanged(u=>{unsubs.forEach(f=>f());unsubs=[];
 if(!u){authed=false;db=null;myId='local';rooms=[];renderRooms();paintMe();if(bloomOpen)toggleBloom();$('hint').textContent='Коснись ядра, чтобы войти';return}
 authed=true;myId=u.uid;acctName=(u.email||'').split('@')[0];myCode=codeOf(myId);$('myCode').textContent=myCode;$('myEmail').textContent=u.email||'';paintMe();
 $('hint').textContent='Коснись аватарки, чтобы раскрыть меню';
 let ensured=false;
 unsubs.push(fdb.collection('profiles').onSnapshot(s=>{fam={};s.docs.forEach(x=>fam[x.id]=x.data({serverTimestamps:'estimate'}));calibrate();if(curRoom)paintSub();if(fam[myId])myProf={...myProf,...fam[myId]};paintMe();renderRooms();
  if(!ensured){ensured=true;const pr={name:myProf.name||acctName,status:myProf.status||'',avatar:myProf.avatar||'',code:myCode,findable:fam[myId]?.findable??true,at:Date.now()};
   if(!fam[myId]||fam[myId].code!==myCode)fdb.doc('profiles/'+myId).set(pr,{merge:true}).catch(()=>{});
   fdb.doc('lookup/'+myCode).set({uid:myId}).catch(()=>{});if(u.email)fdb.doc('lookup/'+u.email.toLowerCase()).set({uid:myId}).catch(()=>{})}},()=>{}));
 db=fdb;unsubs.push(db.collection('rooms').where('members','array-contains',myId).onSnapshot(s=>{rooms=s.docs.map(x=>({id:x.id,...x.data()})).sort((a,b)=>ms(b.at)-ms(a.at));if(curRoom){const c=rooms.find(x=>x.id===curRoom.id);if(c){Object.assign(curRoom,c);markRead(c);paintTicks()}}rooms.forEach(trackTyping);if(curRoom){paintSub()}renderRooms();paintBadges()},e=>toast('Нет доступа к чатам')));
});
function authSheet(){sheet((sh,close)=>{let mode='in';const h=document.createElement('div');h.className='head';h.innerHTML='<div class="ava">✦</div><b>Вход в Bazhe</b>';sh.appendChild(h);
 const em=field(sh,'Почта','you@mail.ru',80);em.type='email';em.autocomplete='email';em.inputMode='email';
 const pw=field(sh,'Пароль','Не меньше 6 символов',64);pw.type='password';pw.autocomplete='current-password';
 const err=document.createElement('p');err.className='sect';err.style.cssText='text-transform:none;letter-spacing:0;justify-content:center;text-align:center;color:#ff8a8a;min-height:1em';sh.appendChild(err);
 const go=btn('Войти','main',async()=>{err.textContent='';const e=em.value.trim(),p=pw.value;if(!e||p.length<6){err.textContent='Впиши почту и пароль от 6 символов';return}
  go.disabled=true;go.textContent='Секунду…';
  try{if(mode==='in')await auth.signInWithEmailAndPassword(e,p);else await auth.createUserWithEmailAndPassword(e,p);close();setTimeout(()=>{if(!bloomOpen)toggleBloom()},400)}
  catch(x){const m={'auth/invalid-credential':'Неверная почта или пароль','auth/wrong-password':'Неверный пароль','auth/user-not-found':'Такой почты нет. Нажми «Создать аккаунт»','auth/email-already-in-use':'Эта почта уже занята. Войди','auth/invalid-email':'Почта написана с ошибкой','auth/weak-password':'Пароль слишком простой','auth/network-request-failed':'Нет интернета'};err.textContent=m[x.code]||'Ошибка: '+x.code}
  go.disabled=false;go.textContent=mode==='in'?'Войти':'Создать аккаунт'});sh.appendChild(go);
 const sw=btn('Нет аккаунта? Создать','',()=>{mode=mode==='in'?'up':'in';go.textContent=mode==='in'?'Войти':'Создать аккаунт';sw.textContent=mode==='in'?'Нет аккаунта? Создать':'Уже есть аккаунт? Войти';pw.autocomplete=mode==='in'?'current-password':'new-password';h.querySelector('b').textContent=mode==='in'?'Вход в Bazhe':'Новый аккаунт'});sh.appendChild(sw);
 sh.appendChild(btn('Забыл пароль','',async()=>{const e=em.value.trim();if(!e){err.textContent='Сначала впиши почту';return}try{await auth.sendPasswordResetEmail(e);err.style.color='#7dffb0';err.textContent='Письмо для сброса отправлено'}catch(x){err.textContent='Не получилось отправить письмо'}}));
 setTimeout(()=>em.focus(),400)})}
if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});
